name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Solo chromium: es el único proyecto definido en
        # playwright.config.ts (ver ese archivo para el porqué).
        # `playwright install --with-deps` sin argumentos descarga los
        # 5 motores soportados aunque no se usen, alargando el CI sin
        # necesidad.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # k6-action corre k6 en su propio contenedor Docker, separado
      # del contenedor/host donde corre este step — "localhost" desde
      # adentro de ese contenedor no resuelve al runner. Por eso el
      # server de la app tiene que quedar accesible en la red del
      # runner (no dockerizado) y el contenedor de k6 alcanzarlo vía
      # el gateway del host, que es exactamente lo que resuelve
      # `network: host` en el step de abajo.
      #
      # Reusamos el mismo mecanismo que ya usa Playwright
      # (e2e/build-for-e2e.mjs: build de producción + vite preview
      # sirviendo en la raíz del puerto) en vez de duplicar la lógica
      # de build acá. Ese script deja el server corriendo en foreground
      # en el puerto 3000, así que lo lanzamos en background y
      # esperamos a que responda antes de correr k6.
      - name: Build and start preview server
        run: |
          node ./e2e/build-for-e2e.mjs &
          echo $! > server.pid
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run load tests (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-test/load-test.js
        env:
          BASE_URL: http://localhost:3000
        # `options: --net=host` se sacó de acá: no es un input válido
        # de grafana/k6-action (action tipo `docker`, sus únicos inputs
        # son cloud/token/filename/flags — ver action.yml del repo,
        # que además está archivado/read-only) ni una clave válida de
        # step fuera de `with:`. GitHub no podía ni parsear el archivo
        # con esa línea ahí (error: "Unexpected value 'options'"),
        # lo cual rompía el workflow ENTERO — ningún job corría, ni
        # siquiera unit-tests/type-check, que no tienen nada que ver
        # con k6. Si hace falta host networking real para que el
        # contenedor de k6 alcance localhost:3000, hay que resolverlo
        # de otra forma (p.ej. correr k6 directo con la CLI instalada
        # en el runner, en vez de vía esta action dockerizada) — pero
        # eso es un cambio aparte, no un fix de sintaxis.

      - name: Stop preview server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No existe "npm run lint" en package.json (no hay ESLint
      # configurado en el repo) — el chequeo estático real de este
      # proyecto es TypeScript en modo estricto. "type-check" corre
      # tsc --noEmit dos veces (app + service worker, ver
      # tsconfig.sw.json) tal como está definido en package.json.
      - name: Run type check
        run: npm run type-check
