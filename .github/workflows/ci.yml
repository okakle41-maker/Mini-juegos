name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Solo chromium: es el único proyecto definido en
        # playwright.config.ts (ver ese archivo para el porqué).
        # `playwright install --with-deps` sin argumentos descarga los
        # 5 motores soportados aunque no se usen, alargando el CI sin
        # necesidad.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run load tests (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-test/load-test.js

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No existe "npm run lint" en package.json (no hay ESLint
      # configurado en el repo) — el chequeo estático real de este
      # proyecto es TypeScript en modo estricto. "type-check" corre
      # tsc --noEmit dos veces (app + service worker, ver
      # tsconfig.sw.json) tal como está definido en package.json.
      - name: Run type check
        run: npm run type-check
