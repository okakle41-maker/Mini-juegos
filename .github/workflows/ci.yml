name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Diagnóstico rápido para un fallo que ya se dio en un entorno de
      # desarrollo local (nunca en este CI hasta ahora): `npm ci` en
      # teoría siempre instala el binario nativo correcto de
      # `lightningcss` para la plataforma del runner (ubuntu-latest =
      # linux-x64-gnu) a partir del lockfile — pero si alguna vez una
      # cache de npm corrupta o parcial hiciera que faltara, el error
      # real que tira Vite/Rolldown más abajo (en "Run unit tests", que
      # corre buildStaticAssets.test.ts, un test que sí ejecuta
      # `vite build` de verdad) es un stack trace de WASM binding
      # críptico que no menciona lightningcss en ningún lado obvio.
      # Este paso falla rápido y con un mensaje que sí lo dice.
      - name: Verify lightningcss native binding
        run: node -e "require('lightningcss'); console.log('lightningcss OK — binario nativo cargado correctamente')"

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Solo chromium: es el único proyecto definido en
        # playwright.config.ts (ver ese archivo para el porqué).
        # `playwright install --with-deps` sin argumentos descarga los
        # 5 motores soportados aunque no se usen, alargando el CI sin
        # necesidad.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # grafana/k6-action corre k6 dentro de su propio contenedor
      # Docker, separado de la red del runner. Confirmado en logs de
      # CI: el preview server sí levanta en localhost:3000 (wait-on lo
      # verifica bien), pero luego k6 tira "connect: connection
      # refused" contra ese mismo localhost:3000 — porque el localhost
      # del contenedor de k6 no es el localhost del runner. `network:
      # host` NO es un input válido de esta action (ver nota de más
      # abajo, ya se intentó y rompía el parseo del workflow entero),
      # así que en vez de pelear con la red del contenedor, instalamos
      # el binario de k6 directo en el runner: así k6 y el preview
      # server comparten el mismo localhost sin Docker de por medio.
      #
      # Reusamos el mismo mecanismo que ya usa Playwright
      # (e2e/build-for-e2e.mjs: build de producción + vite preview
      # sirviendo en la raíz del puerto) en vez de duplicar la lógica
      # de build acá. Ese script deja el server corriendo en foreground
      # en el puerto 3000, así que lo lanzamos en background y
      # esperamos a que responda antes de correr k6.
      - name: Build and start preview server
        run: |
          node ./e2e/build-for-e2e.mjs &
          echo $! > server.pid
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load tests (k6)
        run: k6 run load-test/load-test.js
        env:
          BASE_URL: http://localhost:3000
        # `options: --net=host` se sacó de acá: no es un input válido
        # de grafana/k6-action (action tipo `docker`, sus únicos inputs
        # son cloud/token/filename/flags — ver action.yml del repo,
        # que además está archivado/read-only) ni una clave válida de
        # step fuera de `with:`. GitHub no podía ni parsear el archivo
        # con esa línea ahí (error: "Unexpected value 'options'"),
        # lo cual rompía el workflow ENTERO. Ahora que k6 corre nativo
        # en el runner (step de arriba) este problema de red directamente
        # no existe: no hay contenedor de k6 al que darle host networking.

      - name: Stop preview server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El chequeo estático de tipos: TypeScript en modo estricto,
      # separado del linting de estilo/patrones que corre el job
      # "lint" (ESLint) de arriba. "type-check" corre tsc --noEmit dos
      # veces (app + service worker, ver tsconfig.sw.json) tal como
      # está definido en package.json.
      - name: Run type check
        run: npm run type-check
