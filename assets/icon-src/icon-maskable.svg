<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgm" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#150a03"/>
      <stop offset="100%" stop-color="#090400"/>
    </radialGradient>
    <linearGradient id="accentm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9200"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
  </defs>

  <!-- El fondo cubre el lienzo completo: en maskable icons el SO recorta -->
  <!-- hasta un círculo inscripto, así que el resto del contenido vive -->
  <!-- dentro del 80% central (zona segura) para no perder el glifo. -->
  <rect width="512" height="512" fill="url(#bgm)"/>

  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentm)" stroke-width="12" opacity="0.9"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#ff6b00" stroke-width="3" opacity="0.35"/>

  <circle cx="256" cy="118" r="10" fill="#ff9200"/>
  <circle cx="256" cy="394" r="10" fill="#ff9200"/>
  <circle cx="118" cy="256" r="10" fill="#ff9200"/>
  <circle cx="394" cy="256" r="10" fill="#ff9200"/>

  <polygon points="224,196 224,316 336,256" fill="url(#accentm)"/>
</svg>
